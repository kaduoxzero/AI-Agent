version: 1.0

rules:
  required:
    - SKILL.md
    - skill.yaml
    - README.md

  boundary:
    require_capabilities: true
    require_inputs: true
    require_outputs: true
    require_scope_definition: true

  safety:
    require_risk_level: true
    require_dependencies: true

  maintainability:
    require_version: true
    require_examples: false
    require_evaluation: true

  architecture:
    require_single_responsibility: true
    require_no_circular_dependency: true
