# Project identity for .agent-engineering/project.yaml.
# Instantiate (copy) into the business project root; never write back to templates/.
schema_version: 1
project_id: ""        # stable across the project lifetime; do not regenerate without reason
project_name: ""      # human-readable name
project_root: ""      # absolute path; may be updated if the directory moves
created_at: ""        # ISO 8601 timestamp of first initialization
updated_at: ""        # ISO 8601 timestamp of last state update
current_phase: discovery   # discovery | design | build | harden | production
current_task: null    # short description or id of the current task; null when idle
