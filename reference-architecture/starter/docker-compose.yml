x-platform-env: &platform-env
  DATABASE_URL: postgresql+asyncpg://agent:agent@postgres:5432/agent
  REDIS_URL: redis://redis:6379/0
  TASK_QUEUE_NAME: agent-platform:tasks
  EVENT_KEY_PREFIX: agent-platform:events

x-platform-depends: &platform-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment: *platform-env
    depends_on: *platform-depends
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "apps.worker.main"]
    environment: *platform-env
    depends_on: *platform-depends
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - agent_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - agent_redis_data:/data

volumes:
  agent_pg_data:
  agent_redis_data:
