# Skill Manifest Template

> 本文件已被规范模板取代。Skill manifest 的唯一权威模板：

```text
skills/SKILL-MANIFEST-TEMPLATE.yaml
```

实际实例见各技能目录：

```text
skills/<skill-name>/skill.yaml
```

结构差异说明：本目录曾使用 apiVersion/kind/metadata/spec 结构；运行时体系最终采用扁平结构（name / version / category / description / capabilities / trigger / risk / dependencies / status）。校验规则由 `scripts/validate_skills.py` 执行。
