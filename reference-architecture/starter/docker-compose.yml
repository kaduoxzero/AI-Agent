x-platform-env: &platform-env
  DATABASE_URL: postgresql+asyncpg://agent:agent@postgres:5432/agent
  REDIS_URL: redis://redis:6379/0
  ARTIFACT_DIR: /data/artifacts
  TASK_QUEUE_NAME: agent-platform:tasks
  EVENT_KEY_PREFIX: agent-platform:events
  DEFAULT_AGENT_ID: research-platform
  MIN_RELEASE_EVAL_SCORE: "0.8"
  AUTO_CREATE_SCHEMA: "false"

x-infra-depends: &infra-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: *platform-env
    depends_on: *infra-depends
    restart: "no"

  api:
    build: .
    ports:
      - "8000:8000"
    environment: *platform-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - agent_artifacts:/data/artifacts

  worker:
    build: .
    command: ["python", "-m", "apps.worker.main"]
    environment: *platform-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - agent_artifacts:/data/artifacts

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - agent_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - agent_redis_data:/data

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - agent_prometheus_data:/prometheus
    depends_on:
      - api

volumes:
  agent_pg_data:
  agent_redis_data:
  agent_artifacts:
  agent_prometheus_data:
